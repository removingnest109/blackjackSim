name: Build

on:
  push:
    branches: [ master ]
    paths:
      - src/**
      - CMakeLists.txt
      - .github/workflows/build.yml

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        build-type: [Debug, Release]

    steps:
    - uses: actions/checkout@v4

    - name: Set up CMake
      uses: lukka/get-cmake@latest

    - name: Setup build environment (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols

    - name: Setup build environment (Windows)
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v1

    - name: Create build directory
      run: mkdir -p build
      shell: bash

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}
      shell: bash

    - name: Build
      run: cmake --build build --config ${{ matrix.build-type }}
      shell: bash


