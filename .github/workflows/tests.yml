name: Tests

on:
  push:
    branches: [ master ]
    paths:
      - src/**
      - tests/**
      - CMakeLists.txt
      - .github/workflows/tests.yml

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        build-type: [Debug, Release]

    steps:
    - uses: actions/checkout@v4

    - name: Set up CMake
      uses: lukka/get-cmake@latest

    - name: Setup build environment (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    - name: Setup build environment (Windows)
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v1

    - name: Create build directory
      run: mkdir -p build
      shell: bash

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DBLACKJACK_GUI=OFF
      shell: bash

    - name: Build
      run: cmake --build build --config ${{ matrix.build-type }}
      shell: bash

    - name: Run tests
      run: ctest --build-config ${{ matrix.build-type }} --output-on-failure
      working-directory: build
      shell: bash

    - name: Display test results
      if: always()
      run: |
        echo "Test configuration: ${{ matrix.build-type }}"
        echo "OS: ${{ runner.os }}"
      shell: bash


