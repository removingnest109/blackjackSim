name: Draft Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag to release (existing or new)
        required: true
      release_name:
        description: Optional release title
        required: false
      target_commitish:
        description: Branch or commit to tag when creating a new tag
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update draft release
        uses: softprops/action-gh-release@v2.0.8
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.release_name || github.ref_name }}
          target_commitish: ${{ github.event.inputs.target_commitish || github.event.repository.default_branch || github.sha }}
          draft: true
          generate_release_notes: true
