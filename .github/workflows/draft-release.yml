name: Draft Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag to release (existing or new)
        required: true
      release_name:
        description: Optional release title
        required: false
      target_commitish:
        description: Branch or commit to tag when creating a new tag
        required: false
  push:
    tags:
      - "v*"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.vars.outputs.release_tag }}
      release_name: ${{ steps.vars.outputs.release_name }}
      target_commitish: ${{ steps.vars.outputs.target_commitish }}
      build_ref: ${{ steps.vars.outputs.build_ref }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag_name }}"
            release_name="${{ github.event.inputs.release_name }}"
            target_commitish="${{ github.event.inputs.target_commitish }}"

            if [ -z "$target_commitish" ]; then
              target_commitish="${{ github.event.repository.default_branch }}"
            fi
          else
            tag="${{ github.ref_name }}"
            release_name=""
            target_commitish="${{ github.sha }}"
          fi

          if [ -z "$release_name" ]; then
            release_name="$tag"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            build_ref="refs/tags/$tag"
          else
            build_ref="$target_commitish"
          fi

          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
          echo "target_commitish=$target_commitish" >> "$GITHUB_OUTPUT"
          echo "build_ref=$build_ref" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.build_ref }}

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Setup build environment (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Setup build environment (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v1

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
        shell: bash

      - name: Build
        run: cmake --build build --config Release
        shell: bash

      - name: Package Linux release assets
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/linux
          cp build/blackjack dist/linux/
          cp build/blackjack_gui dist/linux/
          cp README.md dist/linux/
          tar -C dist/linux -czf "blackjack-${{ needs.prepare.outputs.release_tag }}-linux-x64.tar.gz" blackjack blackjack_gui README.md
        shell: bash

      - name: Package Windows release assets
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Path dist/windows -Force | Out-Null
          Copy-Item build/Release/blackjack.exe dist/windows/
          Copy-Item build/Release/blackjack_gui.exe dist/windows/
          Copy-Item README.md dist/windows/
          Compress-Archive -Path dist/windows/* -DestinationPath "blackjack-${{ needs.prepare.outputs.release_tag }}-windows-x64.zip" -Force
        shell: pwsh

      - name: Upload Linux release archive
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-assets-linux
          path: blackjack-${{ needs.prepare.outputs.release_tag }}-linux-x64.tar.gz

      - name: Upload Windows release archive
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-assets-windows
          path: blackjack-${{ needs.prepare.outputs.release_tag }}-windows-x64.zip

  draft-release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: dist

      - name: Create or update draft release
        uses: softprops/action-gh-release@v2.0.8
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          target_commitish: ${{ needs.prepare.outputs.target_commitish }}
          draft: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
